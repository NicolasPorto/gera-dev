  <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />
  <link rel="dns-prefetch" href="https://googleads.g.doubleclick.net" />

  <script>
    (function () {
      var loaded = false;
      function loadAds() {
        if (loaded) return;
        loaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8178345912301600';
        document.head.appendChild(s);
      }
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadAds, { timeout: 5000 });
      } else {
        setTimeout(loadAds, 3000);
      }
      ['scroll', 'click', 'keydown', 'touchstart'].forEach(function (evt) {
        window.addEventListener(evt, loadAds, { once: true, passive: true });
      });
    })();
  </script>
</head>
